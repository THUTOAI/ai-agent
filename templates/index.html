<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Streetcode Clothing - Shop Assistant</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
</head>

<body>
  <div class="chatbot-container">
    <div class="chatbot-header">
      <h1>🛒 Streetcode Clothing Store Assistant</h1>
      <p>What's good STRAATA Gang?</p>
      <button id="owner-access-button" class="owner-access-button" type="button">
        Owner stock room
      </button>
    </div>

    <div class="chat-window" id="chat-window"></div>

    <div class="chat-input-area">
      <input type="text" id="user-input" class="chat-input" placeholder="Ask about an item or type 'bye' to exit..."
        autocomplete="off" />
      <button id="send-button" class="send-button">Send</button>
    </div>
  </div>

  <div id="owner-panel" class="owner-panel" hidden>
    <div class="owner-panel-card" role="dialog" aria-modal="true" aria-labelledby="owner-panel-title">
      <button id="close-owner-panel" class="close-owner-panel" type="button" aria-label="Close owner stock room">
        &times;
      </button>
      <div id="owner-login-view">
        <p class="eyebrow">Private access</p>
        <h2 id="owner-panel-title">Owner stock room</h2>
        <p class="owner-copy">
          Review monthly sales and record stock-taking adjustments.
        </p>
        <form id="owner-login-form" class="owner-form">
          <label for="owner-pin">Owner PIN</label>
          <input id="owner-pin" type="password" inputmode="numeric" autocomplete="current-password" required />
          <button class="owner-primary-button" type="submit">
            Unlock stock room
          </button>
          <p id="owner-login-error" class="owner-error" role="alert"></p>
        </form>
      </div>

      <div id="owner-dashboard-view" hidden>
        <div class="owner-dashboard-heading">
          <div>
            <p class="eyebrow">Owner view</p>
            <h2>Monthly stock taking</h2>
          </div>
          <button id="owner-lock-button" class="owner-secondary-button" type="button">
            Lock
          </button>
        </div>
        <div class="owner-controls">
          <label for="stock-month">Month</label>
          <input id="stock-month" type="month" />
          <button id="clear-stock-month" class="owner-secondary-button" type="button">
            Clear month
          </button>
        </div>
        <form id="inventory-upload-form" class="inventory-upload-form">
          <label for="inventory-file">Product catalogue (.xlsx)</label>
          <input id="inventory-file" type="file" accept=".xlsx" required />
          <button class="owner-secondary-button" type="submit">
            Load catalogue
          </button>
          <p id="inventory-upload-status" class="stock-entry-status" role="status"></p>
        </form>
        <form id="stock-entry-form" class="stock-entry-form">
          <label>Product name<input id="stock-product" type="text" placeholder="e.g. Hoodie" required /></label>
          <label>Colour<input id="stock-colour" type="text" placeholder="e.g. Black" required /></label>
          <label>Size<input id="stock-size" type="text" placeholder="e.g. M" required /></label>
          <label>Units sold<input id="stock-quantity" type="number" min="1" value="1" required /></label>
          <button class="owner-primary-button" type="submit">
            Add stock count
          </button>
        </form>
        <p id="stock-entry-status" class="stock-entry-status" role="status"></p>
        <div class="stock-summary" id="stock-summary"></div>
        <div class="stock-table-wrap">
          <table class="stock-table">
            <thead>
              <tr>
                <th>Rank</th>
                <th>Product</th>
                <th>Colour</th>
                <th>Size</th>
                <th>In stock</th>
                <th>Units sold</th>
                <th>Reorder</th>
              </tr>
            </thead>
            <tbody id="stock-table-body"></tbody>
          </table>
          <p id="empty-stock-state" class="empty-stock-state">
            No sales recorded for this month yet.
          </p>
        </div>
      </div>
    </div>
  </div>

  <script src="{{ url_for('static', filename='chatbot.js') }}"></script>
</body>

</html>
